[package]
name = "bleakhold_launcher_core"
version = "1.2.0"
edition = "2021"
description = "Bleakhold Launcher engine: manifest, signature, planner, downloader, local state, realmlist, self-update"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
log = { version = "0.4", features = ["std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Tests sign their own manifests; the library itself only verifies.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
