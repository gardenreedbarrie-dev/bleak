[package]
name = "bleakhold-launcher"
version = "1.2.0"
edition = "2021"
description = "Bleakhold Launcher: installs, updates and starts the Bleakhold client"
publish = false
default-run = "BleakholdLauncher"

[[bin]]
name = "BleakholdLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bleakhold_launcher_core = { path = "../core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[features]
# Plain `cargo build` must embed the UI (the Tauri CLI would add this itself).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
