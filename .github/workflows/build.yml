name: Build Bleakhold Client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure (x64)
        run: cmake -S . -B build/x64 -G "Visual Studio 17 2022" -A x64 -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=ON

      - name: Build
        run: cmake --build build/x64 --config Release --target WowClient Wow --parallel

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: bleakhold-client-x64
          path: |
            bin/Win/*.exe
            bin/Win/*.dll
          if-no-files-found: error
          retention-days: 30
