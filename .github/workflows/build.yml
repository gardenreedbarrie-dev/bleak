name: Build Bleakhold Client

on:
  workflow_dispatch:
    inputs:
      addicatui_art:
        description: "Also build the AddicatUI art package (DragonUI's World of Warcraft artwork, fetched from upstream)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure (x64)
        run: cmake -S . -B build/x64 -G "Visual Studio 17 2022" -A x64 -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=ON -DBLEAKFX_REQUIRE_SHADERS=ON -DWOW_OUTPUT_OVERRIDE=Bleakhold "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/INCREMENTAL:NO /MAP"

      - name: Build
        run: cmake --build build/x64 --config Release --target WowClient Wow --parallel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build RaceForge
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --onefile --name BleakholdRaceForge --add-data "Tools/RaceForge/races.json;." --paths Tools/RaceForge --paths Tools/MpqPack --hidden-import mpqpack --distpath build/raceforge/dist --workpath build/raceforge/work Tools/RaceForge/raceforge.py

      # One folder the player copies over a 3.3.5a client: the executables, the glue screens, the emoji art
      # (loose BLPs in Data\Interface\Bleakhold\Emoji, like the glue files), the dance pack (built here by
      # DanceForge from the choreography), the UI addon and RaceForge. No game data.
      - name: Package
        shell: pwsh
        run: |
          $p = "package/Bleakhold"
          New-Item -ItemType Directory -Force "$p/Data/Interface/Bleakhold", "$p/Interface/AddOns", "$p/Tools" | Out-Null
          Copy-Item bin/Win/*.exe $p
          Copy-Item -Recurse Interface/Bleakhold/Glue "$p/Data/Interface/Bleakhold/Glue"
          Copy-Item -Recurse Interface/Bleakhold/Emoji "$p/Data/Interface/Bleakhold/Emoji"
          python Tools/DanceForge/danceforge.py pack --out "$p/Data/Interface/Bleakhold/Dances/Dances.bdc"
          if ($LASTEXITCODE -ne 0) { throw "DanceForge could not build the dance pack" }
          Copy-Item -Recurse Interface/Bleakhold/Dances/Music "$p/Data/Interface/Bleakhold/Dances/Music"
          Copy-Item -Recurse Interface/AddOns/Bleakhold "$p/Interface/AddOns/Bleakhold"
          # AddicatUI's code; its art (AddicatUI_Art) is not game-data free and comes separately (Tools/AddicatUI)
          Copy-Item -Recurse Interface/AddOns/AddicatUI "$p/Interface/AddOns/AddicatUI"
          Copy-Item -Recurse Interface/AddOns/AddicatUI_Options "$p/Interface/AddOns/AddicatUI_Options"
          Copy-Item build/raceforge/dist/BleakholdRaceForge.exe "$p/Tools"
          Copy-Item Tools/Package/INSTALL.txt $p
          if (-not (Test-Path "$p/Bleakhold.exe")) { throw "Bleakhold.exe missing from the package" }
          if (Get-ChildItem -Recurse $p -Filter *.dll) { throw "the package must not contain DLLs" }
          if (-not (Test-Path "$p/Data/Interface/Bleakhold/Emoji/Emoji000.blp")) { throw "emoji art missing from the package" }
          if (-not (Test-Path "$p/Data/Interface/Bleakhold/Dances/Dances.bdc")) { throw "dance pack missing from the package" }

      # DragonUI's artwork for AddicatUI (World of Warcraft art): only when asked for, as an artifact of its own.
      - name: AddicatUI art
        if: ${{ inputs.addicatui_art }}
        shell: pwsh
        run: |
          $up = (Get-Content Tools/AddicatUI/UPSTREAM).Split(" ")
          git clone --filter=blob:none $up[0] build/dragonui
          if ($LASTEXITCODE -ne 0) { throw "could not fetch DragonUI" }
          git -C build/dragonui checkout --quiet $up[1]
          if ($LASTEXITCODE -ne 0) { throw "DragonUI has no commit $($up[1])" }
          $a = "package-art/Bleakhold-AddicatUI-Art/Interface/AddOns"
          New-Item -ItemType Directory -Force $a | Out-Null
          python Tools/AddicatUI/sync_dragonui.py art build/dragonui $a
          if ($LASTEXITCODE -ne 0) { throw "sync_dragonui.py art failed" }
          if (-not (Test-Path "$a/AddicatUI_Art/AddicatUI_Art.toc")) { throw "AddicatUI_Art missing" }

      - name: Upload AddicatUI art
        if: ${{ inputs.addicatui_art }}
        uses: actions/upload-artifact@v4
        with:
          name: addicatui-art
          path: package-art/
          if-no-files-found: error
          retention-days: 30

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: bleakhold-client-x64
          path: package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload symbol map
        uses: actions/upload-artifact@v4
        with:
          name: bleakhold-client-x64-map
          path: |
            bin/Win/*.map
            build/x64/**/*.map
          if-no-files-found: warn
          retention-days: 30

  # Checks that run on Linux: the Bleakhold Lua (lint against the 3.3.5a API, unit tests) and the Python tools.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils python3-pil python3-numpy

      - name: Lua lint and tests
        run: bash Tools/UiLint/check.sh

      - name: Python tool tests
        run: |
          python3 -I Tools/MpqPack/tests/run_tests.py
          python3 -I Tools/RaceForge/tests/run_tests.py
          python3 -I Tools/EmojiForge/tests/run_tests.py
          python3 -I Tools/DanceForge/tests/run_tests.py
          python3 -I Tools/DanceForge/danceforge.py check

      - name: Grass wind shader patch tests
        run: bash Tools/GrassWind/tests/run_tests.sh

      - name: Server module tests
        run: bash Server/mod-bleakhold-ui/tests/run_tests.sh --fuzz-iterations 100000 --fuzz-seconds 20
